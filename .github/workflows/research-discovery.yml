name: Scheduled Public GitHub Discovery

on:
  workflow_dispatch:
    inputs:
      query:
        description: GitHub repository search query
        required: true
        default: 'flash loan arbitrage'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: public-github-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify research engine
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Discover and persist a bounded public-repository snapshot
        env:
          PYTHONPATH: src
          FLR_DATABASE: /tmp/flashloan-research.sqlite3
          FLR_SNAPSHOT_DIR: /tmp/flashloan-research-vault
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_QUERY: ${{ inputs.query || 'flash loan arbitrage' }}
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%Y-%m-%d)"
          OUTPUT="research_runs/${RUN_DATE}/discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "$(dirname "$OUTPUT")"
          python -m flashloan_research.cli discover --query "$SEARCH_QUERY" --per-page 30 --page 1 --output "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m flashloan_research.cli status | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m "data: record GitHub discovery run ${GITHUB_RUN_ID}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No discovery report changes to persist." >> "$GITHUB_STEP_SUMMARY"
          fi
