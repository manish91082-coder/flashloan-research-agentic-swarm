name: Autonomous Flash Loan Repository Discovery

on:
  # One-shot, no-browser trigger: only a change to the dedicated marker file starts discovery.
  push:
    branches: [main]
    paths:
      - 'research_runs/trigger-discovery.json'
  workflow_dispatch:
    inputs:
      families:
        description: Comma-separated taxonomy family IDs; blank runs all 11 families
        required: false
        default: ''
      per_page:
        description: Results per GitHub query page (maximum 100)
        required: true
        default: '100'
      max_pages:
        description: Maximum pages per query (maximum 10)
        required: true
        default: '10'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: flashloan-taxonomy-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install project
        run: pip install -e '.[agentic]'
      - name: Verify research engine
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Run all selected keyword families with pagination
        env:
          PYTHONPATH: src
          FLR_DATABASE: /tmp/flashloan-research.sqlite3
          FLR_SNAPSHOT_DIR: /tmp/flashloan-research-vault
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_FAMILIES: ${{ inputs.families }}
          SEARCH_PER_PAGE: ${{ inputs.per_page || '100' }}
          SEARCH_MAX_PAGES: ${{ inputs.max_pages || '10' }}
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%Y-%m-%d)"
          OUTPUT="research_runs/mission/${RUN_DATE}/discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "$(dirname "$OUTPUT")"
          ARGS=(discover-mission --taxonomy research/keyword-taxonomy.json --per-page "$SEARCH_PER_PAGE" --max-pages "$SEARCH_MAX_PAGES" --output "$OUTPUT")
          if [[ -n "$SEARCH_FAMILIES" ]]; then
            ARGS+=(--families "$SEARCH_FAMILIES")
          fi
          python -m flashloan_research.cli "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

          # Convert each live discovery snapshot into immutable audit packets.
          IMPORT_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BATCH_DIR="research_runs/audit-batches/${IMPORT_RUN_ID}"
          python -m flashloan_research.cli import-discovery \
            --input "$OUTPUT" \
            --run-id "$IMPORT_RUN_ID" \
            --batch-size 200 | tee -a "$GITHUB_STEP_SUMMARY"
          python -m flashloan_research.cli export-discovery-batches \
            --run-id "$IMPORT_RUN_ID" \
            --output-dir "$BATCH_DIR" \
            --batch-size 100 \
            --source-report "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          root = Path("research_runs/audit-batches") / (os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["status"] == "candidate_metadata_imported_audit_pending"
          assert len(manifest["batches"]) == math.ceil(manifest["candidate_count"] / manifest["batch_size"])
          total = 0
          names = set()
          index = 0
          for batch in manifest["batches"]:
              path = Path(batch["path"])
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == batch["sha256"]
              for line in raw.decode("utf-8").splitlines():
                  if not line:
                      continue
                  row = json.loads(line)
                  assert row["candidate_index"] == index
                  assert row["repository"] == row["metadata"]["full_name"]
                  assert row["audit_status"] == "pending_commit_pinned_source_capture"
                  assert row["repository"] not in names
                  names.add(row["repository"])
                  index += 1
                  total += 1
          assert total == manifest["candidate_count"]
          print(json.dumps({"run_id": manifest["run_id"], "candidate_count": total,
                            "batch_count": manifest["batch_count"], "all_hashes_verified": True}))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$BATCH_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "data: persist discovery ${GITHUB_RUN_ID} and hashed audit batches"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Discovery and audit-batch artifacts are already persisted." >> "$GITHUB_STEP_SUMMARY"
          fi
