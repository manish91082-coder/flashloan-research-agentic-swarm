name: Research Engine CI

on:
  push:
    branches: [main, "phase-a/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional agentic runtime
        run: pip install -e '.[agentic]'
      - name: Validate WSL resume helper syntax
        run: bash -n scripts/resume_source_capture.sh
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Run standard-library tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run synthetic R15D v2 custody tabletop
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: .:src
        run: python scripts/run_r15d_v2_custody_tabletop.py
      # R15D v1 fixture publication remains disabled; v2 artifacts are label-free and scanned before upload.
      - name: Build label-free R15D v2 fixture
        if: matrix.python-version == '3.11'
        run: python scripts/build_r15d_v2_semantic_fixtures.py --output-dir "$RUNNER_TEMP/r15d-v2-fixtures"
      - name: Scan R15D v2 fixture for answer-key leakage
        if: matrix.python-version == '3.11'
        run: python scripts/scan_r15d_v2_artifact_leakage.py --path "$RUNNER_TEMP/r15d-v2-fixtures"
      - name: Upload verified label-free R15D v2 fixture
        if: success() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r15d-v2-label-free-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/r15d-v2-fixtures/
          if-no-files-found: error
          retention-days: 90
