[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashloan-research-agentic-swarm"
version = "0.1.0"
description = "Evidence-first, research-only GitHub flash-loan repository intelligence pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Flash Loan Research Project"}]
dependencies = []

[project.optional-dependencies]
agentic = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-sqlite==3.1.3",
]

[project.scripts]
flashloan-research = "flashloan_research.cli:main"
flashloan-mission-api = "flashloan_research.mission_api:main"
flashloan-mission-worker = "flashloan_research.mission_worker:main"
flashloan-source-capture-worker = "flashloan_research.source_capture_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
